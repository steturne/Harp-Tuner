<script>
/* HARP TUNER 2000 on a phone. The device itself is Mixtape 2's, unchanged (harp-tuner.js, its ear tuner.js and harp sound harp-sound.js,
   copied here by tools\harp-phone.ps1); this page stands in for the parts of Mixtape it leans on:
   - the sound engine: one AudioContext, made on the first tap (a phone only lets sound start from a tap)
   - the files: the saved harps and the tuning log kept in this phone's own browser storage instead of the Mixtape folder
   - the microphone: the phone's own (the page asks with the voice cleaning off); there is no Windows helper here
   - the harp sound: the 74 MB of concert harp recordings stay on the laptop; a tapped string plays the made-up pluck instead
   It listens only after POWER is flipped, turns POWER off when the phone goes to another app, and keeps the screen awake while on. */
(()=>{const M2=window.M2={};
M2.esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
M2.define=d=>{M2.def=d;};
M2.fileUrl=p=>p.split('/').pop();   /* the pictures sit next to this page */
})();
</script>

  changed(){store.set('settings',JSON.stringify(S));},send(){},resized(){},toast,fileUrl:M2.fileUrl,tool(){}};

   display, switch and button cut out of the photo whole (bezel and all) and set into it; the lit pieces that belong to each part are

  paint.stripe=[M+6,y,IW,13];y+=13+9;

  const by=y;y+=6;s=IW/676;part('target',[424,170,676,116],s,M+6,y,{f:3});y+=116*s+5;
  s=(IW-5)/(308+339);part('note',[111,170,308,244],s,M+6,y,{f:3});const cx=M+6+308*s+5;part('cents',[424,289,339,124],s,cx,y,{f:3});part('tune',[767,289,339,124],s,cx,y+122*s,{f:3});

  s=.69;const row=(list,h)=>{const tot=list.reduce((a,c)=>a+c[1][2]*s,0),gap=(W-2*M-tot)/(list.length+1);let x=M+gap;

    const [r,gg,b]=avg(700,790,90,10),col=(k,a=1)=>`rgba(${Math.min(255,r*k)|0},${Math.min(255,gg*k)|0},${Math.min(255,b*k)|0},${a})`;

      const sh=g.createLinearGradient(0,y,0,y+10);sh.addColorStop(0,'rgba(0,0,0,.5)');sh.addColorStop(1,'rgba(0,0,0,0)');rr(x,y,w,h,7);g.fillStyle=sh;g.fill();}

  const cs=getComputedStyle($('#safe')),[t,r,b,l]=['Top','Right','Bottom','Left'].map(k=>parseFloat(cs['padding'+k])||0);
  const V=$('#view'),vw=V.clientWidth-l-r,vh=V.clientHeight-t-b,portrait=vh>vw*1.1;use(portrait);
  const L=LAYOUT[mode],m=portrait?0:10,k=Math.min((vw-2*m)/L.w,(vh-2*m)/L.h);
  stage.style.transform=`translate(${(l+(vw-L.w*k)/2).toFixed(1)}px,${(t+(vh-L.h*k)/2).toFixed(1)}px) scale(${k.toFixed(4)})`;}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,250));fit();

/* ---- full screen (Android, in the browser): hides Chrome's bars; not needed once it is on the home screen ---- */
const fb=$('#full');fb.hidden=standalone||!document.documentElement.requestFullscreen;
fb.onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{});};
document.addEventListener('fullscreenchange',()=>{fb.textContent=document.fullscreenElement?'✕':'⛶';setTimeout(fit,200);});
/* ---- on the home screen: Android offers it (＋ APP); an iPhone is told how, since only there does Safari keep the log for good ---- */
let offer=null;const ib=$('#inst');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();offer=e;ib.hidden=false;});
ib.onclick=async()=>{if(!offer)return;offer.prompt();try{await offer.userChoice;}catch(e){}offer=null;ib.hidden=true;};
addEventListener('appinstalled',()=>{ib.hidden=true;toast('On your home screen now: open it from there');});
if(iOS&&!standalone){const n=+(store.get('iosHint')||0);if(n<3){store.set('iosHint',n+1);
  setTimeout(()=>toast('To keep your tuning log: Share ⎋ then “Add to Home Screen”',8000),1500);}}
/* ---- works with no signal once it has been opened (sw.js keeps a copy of every file) ---- */
if('serviceWorker' in navigator&&location.protocol==='https:'||location.hostname==='localhost')navigator.serviceWorker&&navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
