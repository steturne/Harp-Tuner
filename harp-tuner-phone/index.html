<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1410">
<title>HARP TUNER 2000</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1a1410 radial-gradient(ellipse at 50% 40%,#3a2c20,#120d0a 75%);color:#cfc4b4;font:14px Arial,sans-serif;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#turn{position:absolute;left:0;right:0;top:14px;text-align:center;font-size:15px;letter-spacing:.5px;opacity:.85;display:none}
#turn b{font-size:22px;display:block}
#toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:90%;box-sizing:border-box;padding:9px 16px;border-radius:8px;background:rgba(10,8,6,.92);
  color:#7DFFC8;font:700 13px "Courier New",monospace;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.6);opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
#full{position:absolute;right:8px;top:8px;width:40px;height:40px;border:0;border-radius:8px;background:rgba(255,255,255,.08);color:#cfc4b4;font-size:20px;z-index:8}
#full[hidden]{display:none}
</style></head><body>
<div id="turn"><b>⟲</b>Turn the phone sideways</div>
<div id="stage"></div>
<button id="full" title="Full screen" aria-label="Full screen">⛶</button>
<div id="toast"></div>
<script>
/* HARP TUNER 2000 on a phone. The device itself is Mixtape 2's, unchanged (harp-tuner.js, its ear tuner.js and harp sound harp-sound.js,
   copied here by tools\harp-phone.ps1); this page stands in for the parts of Mixtape it leans on:
   - the sound engine: one AudioContext, made on the first tap (a phone only lets sound start from a tap)
   - the files: the saved harps and the tuning log kept in this phone's own browser storage instead of the Mixtape folder
   - the microphone: the phone's own (the page asks with the voice cleaning off); there is no Windows helper here
   - the harp sound: the 74 MB of concert harp recordings stay on the laptop; a tapped string plays the made-up pluck instead
   It listens only after POWER is flipped, turns POWER off when the phone goes to another app, and keeps the screen awake while on. */
(()=>{const M2=window.M2={};
M2.esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
M2.define=d=>{M2.def=d;};
M2.fileUrl=p=>p.split('/').pop();   /* the pictures sit next to this page */
})();
</script>
<script src="tuner.js"></script>
<script src="harp-sound.js"></script>
<script src="harp-tuner.js"></script>
<script>
(()=>{const M2=window.M2,D=M2.def,$=s=>document.querySelector(s),stage=$('#stage');
if(!D){document.body.insertAdjacentHTML('beforeend','<p style="padding:20px">The tuner did not load.</p>');return;}
const store={get:k=>{try{return localStorage.getItem('ht.'+k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem('ht.'+k,v);return true;}catch(e){return false;}}};
/* the settings (A =, levers, mode, harp, town), kept between visits */
let saved={};try{saved=JSON.parse(store.get('settings')||'{}')||{};}catch(e){}
const S=Object.assign({},D.settings,saved);
/* the files the tuner keeps (Tuning/Harps.json, Tuning/Harp.json): in this phone's storage */
const files={async text(p){return store.get('file:'+p);},async write(p,t){if(!store.set('file:'+p,t))throw new Error('the phone\'s storage is full');}};
/* the sound engine: made on the first tap */
let ctx=null,master=null;
const engine={get ctx(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.connect(ctx.destination);}if(ctx.state!=='running')ctx.resume();return ctx;},
  get master(){return engine.ctx&&master;},busy(){}};
let toastT=0;const toast=t=>{const e=$('#toast');e.textContent=String(t).replace(/^HARP TUNER 2000: /,'');e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),4000);};
const host={uid:'phone',el:stage,settings:S,engine,files,get visible(){return !document.hidden;},
  changed(){store.set('settings',JSON.stringify(S));},send(){},resized(){},toast,fileUrl:M2.fileUrl,tool(){}};
stage.style.width=D.w+'px';stage.style.height=D.h+'px';
const dev=D.create(host),face=stage.querySelector('.ht');
/* the whole face, as big as the screen allows (upright it fits too, smaller, with a word to turn the phone) */
function fit(){if(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName))return;   /* the keyboard is up: leave it be */
  const vw=innerWidth,vh=innerHeight,k=Math.min((vw-12)/D.w,(vh-12)/D.h);
  stage.style.transform=`translate(${(vw-D.w*k)/2}px,${(vh-D.h*k)/2}px) scale(${k})`;$('#turn').style.display=vh>vw?'block':'none';}
addEventListener('resize',fit);fit();
/* another app, or the screen off: POWER off, so the microphone is never left open */
const on=()=>face&&!face.classList.contains('off');
document.addEventListener('visibilitychange',()=>{dev.visible(!document.hidden);if(document.hidden&&on())face.querySelector('.pw').click();});
/* the screen stays awake while POWER is on */
let lock=null;
async function awake(){const want=on()&&!document.hidden;
  if(want&&!lock&&navigator.wakeLock){try{lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>{lock=null;});}catch(e){}}
  else if(!want&&lock){const l=lock;lock=null;l.release().catch(()=>{});}}
if(face)new MutationObserver(awake).observe(face,{attributes:true,attributeFilter:['class']});
/* full screen: hides the browser's own bars (Android) */
const fb=$('#full');fb.hidden=!document.documentElement.requestFullscreen;
fb.onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{});};
document.addEventListener('fullscreenchange',()=>{fb.textContent=document.fullscreenElement?'✕':'⛶';setTimeout(fit,200);});
})();
</script>
</body></html>
